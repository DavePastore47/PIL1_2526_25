<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil - IFRI MentorLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/css/modifie_profil_style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <h1 class="titre-app">IFRI MentorLink</h1>
  <button class="burger-menu" id="burgerBtn">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <div class="nav-links" id="navLinks">
    <a href="/accueil">Accueil</a>
    <a href="/profil-page" class="active">Mon profil</a>
    <a href="/chat">Messages</a>
    <a href="/matching">Matching</a>
    <a href="#" onclick="deconnexion()">Déconnexion</a>
  </div>
</nav>

<main class="page-main">

  <!-- Hero profil -->
  <div class="page-hero">
    <div class="avatar-ring" style="width:72px;height:72px;flex-shrink:0">
      <div class="avatar-initials" id="photo">?</div>
    </div>
    <div class="hero-text">
      <h1 class="page-title" id="nom-utilisateur">Chargement...</h1>
      <p class="page-subtitle" id="filiere-niveau"></p>
    </div>
    <div id="actions-hero" style="display:flex;gap:10px;flex-wrap:wrap">
      <button id="btn-message" class="btn-primary" onclick="contacter()" style="display:none">
        💬 Contacter
      </button>
      <button id="btn-modifier" class="btn-secondary" onclick="window.location.href='/page-modifier-profil'">
        ✏️ Modifier
      </button>
      <button id="btn-parametres" class="btn-secondary" onclick="window.location.href='/parametres'">
        ⚙️ Paramètres
      </button>
    </div>
  </div>

  <!-- Layout deux colonnes -->
  <div class="editor-layout">

    <!-- Infos principales -->
    <div class="editor-left">
      <section class="card">
        <div class="card-header">
          <div class="card-header-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <h2 class="card-title">Informations</h2>
        </div>
        <div class="card-body">
          <div class="field-group">
            <label class="field-label">Biographie</label>
            <p id="bio-utilisateur" style="font-size:.9rem;color:#475569;line-height:1.7">—</p>
          </div>
          <div class="field-group">
            <label class="field-label">Disponibilités</label>
            <p id="disponibilites-utilisateur" style="font-size:.9rem;color:#475569;line-height:1.7">—</p>
          </div>
        </div>
      </section>
    </div>

    <!-- Compétences -->
    <div class="editor-right">
      <section class="card">
        <div class="card-header">
          <div class="card-header-icon card-header-icon--skills">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </div>
          <h2 class="card-title">Compétences</h2>
        </div>
        <div class="card-body">
          <div class="skills-columns">
            <div class="skills-col">
              <div class="skills-col-header skills-col-header--fort">⭐ Points forts</div>
              <div id="competences-fortes" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">
                <p class="empty" style="font-size:.82rem;color:#94a3b8">Aucun</p>
              </div>
            </div>
            <div class="skills-col">
              <div class="skills-col-header skills-col-header--faible">📚 À améliorer</div>
              <div id="competences-faibles" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">
                <p class="empty" style="font-size:.82rem;color:#94a3b8">Aucun</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

  </div>
</main>

<script>
const burgerBtn = document.getElementById('burgerBtn');
const navLinks = document.getElementById('navLinks');
if (burgerBtn) {
    burgerBtn.addEventListener('click', function() {
        navLinks.classList.toggle('open');
    });
}

const params = new URLSearchParams(window.location.search);
const userId = params.get('id');

async function chargerProfil() {
    const url = userId ? '/profil/' + userId : '/profil';
    const reponse = await fetch(url);
    const data = await reponse.json();

    if (data.erreur) {
        window.location.href = '/page-connexion';
        return;
    }

    document.getElementById('nom-utilisateur').textContent = data.prenom + ' ' + data.nom;

    const initiales = (data.prenom[0] + data.nom[0]).toUpperCase();
    document.getElementById('photo').textContent = initiales;

    if (data.filiere || data.niveau) {
        document.getElementById('filiere-niveau').textContent =
            (data.filiere || '') + ' — ' + (data.niveau || '');
    }

    document.getElementById('bio-utilisateur').textContent =
        data.bio || 'Aucune bio renseignée.';

    document.getElementById('disponibilites-utilisateur').textContent =
        data.disponibilites ? '🕐 ' + data.disponibilites : 'Non renseignées.';

    const fortes = document.getElementById('competences-fortes');
    const faibles = document.getElementById('competences-faibles');
    fortes.innerHTML = '';
    faibles.innerHTML = '';

    if (data.competences.length === 0) {
        fortes.innerHTML = '<p style="font-size:.82rem;color:#94a3b8">Aucune</p>';
        faibles.innerHTML = '<p style="font-size:.82rem;color:#94a3b8">Aucune</p>';
    } else {
        data.competences.forEach(function(comp) {
            const tag = document.createElement('span');
            tag.style.cssText = `
                display:inline-block;padding:4px 12px;border-radius:20px;
                font-size:.78rem;font-weight:600;margin:2px;
                background:${comp.type === 'fort' ? '#dcfce7' : '#fef9c3'};
                color:${comp.type === 'fort' ? '#166534' : '#854d0e'};
            `;
            tag.textContent = comp.nom;
            if (comp.type === 'fort') fortes.appendChild(tag);
            else faibles.appendChild(tag);
        });
    }

    if (!userId) {
        document.getElementById('btn-message').style.display = 'none';
        document.getElementById('btn-modifier').style.display = 'inline-flex';
        document.getElementById('btn-parametres').style.display = 'inline-flex';
    } else {
        document.getElementById('btn-message').style.display = 'inline-flex';
        document.getElementById('btn-modifier').style.display = 'none';
        document.getElementById('btn-parametres').style.display = 'none';
    }
}

async function contacter() {
    if (userId) {

        const response = await fetch('/conversations', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ utilisateur_id: parseInt(userId) })
        });
        const data = await response.json();
        if (response.ok) {
            window.location.href = '/chat?conv=' + data.conversation_id;
        } else {
            alert('Erreur : ' + data.erreur);
        }
    }
}

async function deconnexion() {
    await fetch('/deconnexion', { method: 'POST' });
    window.location.href = '/accueil';
}

chargerProfil();
</script>

</body>
</html>
