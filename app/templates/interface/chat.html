<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vos messages</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat_style.css') }}">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>

<body>

    <div id="app">     

        <div id="sidebar">
                <div id="sidebar-header">
                    <h1>MentorLink</h1>
                    <h2>Mes messages</h2>
                </div>
                
            <div id="conv-list">
                Chargement de vos conversations...
            </div>

        </div>
        <!-- Colonne droite : le chat -->
        <div id="chat">

            <!-- Nom d'utilisateur en haut -->
            <div id="chat-header">
                <div id="chat-titre">Sélectionnez une conversation</div>
            </div>

            <!-- Bulles de messages -->
            <div id="messages"></div>

            <!-- Zone pour écrire un message -->
            <div id="input-zone">
                <input id="msg-input" type="text" placeholder="Écrire un message..." disabled/>
                <button id="btn-envoyer" disabled>Envoyer</button>  
            </div>   
        </div>  
    </div>
   
    <script>
      // === LES VARIABLES GLOBALES ===
      const socket = io();
      let convActive = null;
      let monId = null;

      // === ETAPE 1 : Au chargement, on récupère qui on est ===
      async function init() {
        const reponse = await fetch('/profil');
        const profil = await reponse.json();

        if (profil.erreur) {
          window.location.href = '/connexion';
          return;
        }

        monId = profil.id;
        chargerConversations();
      }

      // === ETAPE 2 : On charge la liste des conversations ===
      async function chargerConversations() {
        const reponse = await fetch('/conversations');
        const data = await reponse.json();

        const container = document.getElementById('conv-list');
        container.innerHTML = '';

        data.conversations.forEach(function(conv) {
          const el = document.createElement('div');
          el.className = 'conv-item';
          el.textContent = conv.interlocuteur_nom;
          el.onclick = function() {
            ouvrirConversation(conv.conversation_id, conv.interlocuteur_nom);
          };
          container.appendChild(el);
        });
      }

      // === ETAPE 3 : On ouvre une conversation ===
      async function ouvrirConversation(convId, nom) {
        if (convActive) {
          socket.emit('quitter_conversation', { conversation_id: convActive });
        }

        convActive = convId;
        document.getElementById('chat-titre').textContent = nom;
        document.getElementById('msg-input').disabled = false;
        document.getElementById('btn-envoyer').disabled = false;

        socket.emit('rejoindre_conversation', { conversation_id: convId });

        const reponse = await fetch('/conversations/' + convId + '/messages');
        const data = await reponse.json();
        afficherMessages(data.messages);
      }

      // === ETAPE 4 : On affiche tous les messages ===
      function afficherMessages(messages) {
        const container = document.getElementById('messages');
        container.innerHTML = '';

        messages.forEach(function(msg) {
          ajouterBulle(msg);
        });

        container.scrollTop = container.scrollHeight;
      }

      // === ETAPE 5 : On crée une bulle pour un message ===
      function ajouterBulle(msg) {
        const container = document.getElementById('messages');
        const el = document.createElement('div');

        if (msg.expediteur_id === monId) {
          el.className = 'msg moi';
        } else {
          el.className = 'msg autre';
        }

        const heure = new Date(msg.envoye_a).toLocaleTimeString('fr-FR', {
          hour: '2-digit',
          minute: '2-digit'
        });

        el.innerHTML = '<div class="bubble">' + msg.contenu + '</div>'
                     + '<div class="msg-time">' + heure + '</div>';

        container.appendChild(el);
        container.scrollTop = container.scrollHeight;
      }

      // === ETAPE 6 : Envoyer un message ===
      function envoyerMessage() {
        const input = document.getElementById('msg-input');
        const contenu = input.value.trim();

        if (!contenu || !convActive) return;

        socket.emit('envoyer_message', {
          conversation_id: convActive,
          contenu: contenu
        });

        input.value = '';
      }

      // === ETAPE 7 : Écouter les messages entrants en temps réel ===
      socket.on('nouveau_message', function(msg) {
        if (msg.conversation_id === convActive) {
          ajouterBulle(msg);
        }
      });

      // === ETAPE 8 : Envoyer avec la touche Entrée ===
      document.getElementById('msg-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          envoyerMessage();
        }
      });

      // === ETAPE 9 : Envoyer avec le bouton ===
      document.getElementById('btn-envoyer').addEventListener('click', function() {
        envoyerMessage();
      });

      // === LANCEMENT ===
      init();
    </script>
</body>
</html>
