<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messagerie - IFRI MentorLink</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/chat_style.css">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar" style="position:relative;z-index:200">
  <h1 class="titre-app">IFRI MentorLink</h1>
  <button class="burger-menu" id="burgerBtn">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <div class="nav-links" id="navLinks">
    <a href="/accueil">Accueil</a>
    <a href="/profil-page">Mon profil</a>
    <a href="/chat" class="active">Messages</a>
    <a href="#" onclick="deconnexion()">Déconnexion</a>
  </div>
</nav>

<div id="app">

    <!-- SIDEBAR : liste des conversations -->
    <div id="sidebar">
        <div id="sidebar-header">
            <h1>IFRI MentorLink</h1>
            <h2>Mes messages</h2>
        </div>
        <div id="conv-list">
            <p class="loading">Chargement...</p>
        </div>
    </div>

    <!-- CHAT : zone de messages -->
    <div id="chat">
        <div id="chat-header">
            <div id="chat-titre">Sélectionne une conversation</div>
        </div>
        <div id="messages"></div>
        <div id="input-zone">
            <input id="msg-input" type="text" placeholder="Écrire un message..." disabled/>
            <button id="btn-envoyer" disabled>Envoyer</button>
        </div>
    </div>

</div>

<script>
    const socket = io();
    let convActive = null;
    let monId = null;

    async function init() {
        const reponse = await fetch('/profil');
        const profil = await reponse.json();
        if (profil.erreur) {
            window.location.href = '/page-connexion';
            return;
        }
        monId = profil.id;
        chargerConversations();
    }

    async function chargerConversations() {
        const reponse = await fetch('/conversations');
        const data = await reponse.json();
        const container = document.getElementById('conv-list');
        container.innerHTML = '';

        if (!data.conversations || data.conversations.length === 0) {
            container.innerHTML = '<p class="empty">Aucune conversation</p>';
            return;
        }

        data.conversations.forEach(function(conv) {
            const el = document.createElement('div');
            el.className = 'conv-item';
            el.innerHTML = `
                <div class="conv-nom">${conv.interlocuteur}</div>
                <div class="conv-dernier">${conv.dernier_message || 'Aucun message'}</div>
                ${conv.non_lus > 0 ? `<span class="badge">${conv.non_lus}</span>` : ''}
            `;
            el.onclick = function() {
                ouvrirConversation(conv.id, conv.interlocuteur);
            };
            container.appendChild(el);
        });
    }

    async function ouvrirConversation(convId, nom) {
        if (convActive) {
            socket.emit('quitter_conversation', { conversation_id: convActive });
        }
        convActive = convId;
        document.getElementById('chat-titre').textContent = nom;
        document.getElementById('msg-input').disabled = false;
        document.getElementById('btn-envoyer').disabled = false;
        socket.emit('rejoindre_conversation', { conversation_id: convId });

        const reponse = await fetch('/conversations/' + convId + '/messages');
        const data = await reponse.json();
        afficherMessages(data.messages);
        chargerConversations();
    }

    function afficherMessages(messages) {
        const container = document.getElementById('messages');
        container.innerHTML = '';
        if (!messages || messages.length === 0) {
            container.innerHTML = '<p class="empty">Aucun message. Commencez la conversation !</p>';
            return;
        }
        messages.forEach(function(msg) {
            ajouterBulle(msg);
        });
        container.scrollTop = container.scrollHeight;
    }

    function ajouterBulle(msg) {
        const container = document.getElementById('messages');
        const el = document.createElement('div');
        el.className = msg.expediteur_id === monId ? 'msg moi' : 'msg autre';
        const heure = new Date(msg.envoye_a).toLocaleTimeString('fr-FR', {
            hour: '2-digit', minute: '2-digit'
        });
        el.innerHTML = `<div class="bubble">${msg.contenu}</div><div class="msg-time">${heure}</div>`;
        container.appendChild(el);
        container.scrollTop = container.scrollHeight;
    }

    function envoyerMessage() {
        const input = document.getElementById('msg-input');
        const contenu = input.value.trim();
        if (!contenu || !convActive) return;

        // Afficher immédiatement le message côté expéditeur
        ajouterBulle({
            expediteur_id: monId,
            contenu: contenu,
            envoye_a: new Date().toISOString()
        });

        // Envoyer via SocketIO
        socket.emit('envoyer_message', {
            conversation_id: convActive,
            contenu: contenu
        });

        input.value = '';
    }

    socket.on('nouveau_message', function(msg) {
        // N'afficher que les messages des autres
        if (msg.conversation_id === convActive && msg.expediteur_id !== monId) {
            ajouterBulle(msg);
        }
        chargerConversations();
});
    document.getElementById('msg-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') envoyerMessage();
    });

    document.getElementById('btn-envoyer').addEventListener('click', envoyerMessage);

    // Burger menu
    const burgerBtn = document.getElementById('burgerBtn');
    const navLinks = document.getElementById('navLinks');
    if (burgerBtn) {
        burgerBtn.addEventListener('click', function() {
            navLinks.classList.toggle('open');
        });
    }

    async function deconnexion() {
        await fetch('/deconnexion', { method: 'POST' });
        window.location.href = '/accueil';
    }
    init();
</script>

</body>
</html>
