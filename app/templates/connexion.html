<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - MentorLink</title>
    <link rel="stylesheet" href="/static/connexion_style.css">
</head>
<body>
    <header class="navbar">
        <p class="logo">MentorLink</p>
        <nav class="nav-links" aria-label="Navigation principale">
            <a href="/Accueil.html">Accueil</a>
            <a href="/inscription.html">Inscription</a>
            <a class="active" href="/connexion.html" aria-current="page">Connexion</a>
        </nav>
    
    </header>

    <main>
        <section class="auth-card" aria-labelledby="connexion-title">
            <h1 id="connexion-title">Connexion</h1>
            <p class="intro">Accedez a votre espace MentorLink.</p>

            <form action="/login" method="post">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" name="username" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>

                <button class="primary-button" type="submit">Se connecter</button>
            </form>

            <p class="auth-switch">
                Pas encore de compte ?
                <a href="/inscription.html">Creer un compte</a>
            </p>
        </section>
    </main>
</body>
</html>
