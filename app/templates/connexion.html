<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion - IFRI MentorLink</title>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/css/connexion_style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-blue">
  <h1 class="titre-app">IFRI MentorLink</h1>
  <button class="burger-menu" id="burgerBtn">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <div class="nav-links" id="navLinks">
    <a href="/accueil">Accueil</a>
    <a href="#">À propos</a>
    <a href="/page-connexion" class="active">Connexion</a>
    <a href="/page-inscription">S'inscrire</a>
  </div>
</nav>

<main>
  <section class="auth-card">
    <h1>Connexion</h1>
    <p class="intro">Accédez à votre espace MentorLink.</p>
    <form id="form-connexion">
      <div class="form-group">
        <label for="email">Email ou téléphone</label>
        <input type="text" id="email" name="email" placeholder="Ex : david@ifri.bj" required />
      </div>
      <div class="form-group">
        <label for="mot_de_passe">Mot de passe</label>
        <input type="password" id="mot_de_passe" name="mot_de_passe" placeholder="Votre mot de passe" required />
      </div>
      <button class="primary-button" type="submit">Se connecter</button>
    </form>
    <p class="auth-switch">
      Pas encore de compte ? <a href="/page-inscription">Créer un compte</a>
    </p>
  </section>
</main>

<footer>
  <p>&copy;2026 IFRI_Mentor_link. Tous droits réservés.</p>
</footer>

<script>
// Burger menu
const burgerBtn = document.getElementById('burgerBtn');
const navLinks = document.getElementById('navLinks');
if (burgerBtn) {
    burgerBtn.addEventListener('click', function() {
        navLinks.classList.toggle('open');
    });
}

// Formulaire connexion
document.getElementById('form-connexion').addEventListener('submit', async function(e) {
    e.preventDefault();

    const data = {
        email: document.getElementById('email').value,
        mot_de_passe: document.getElementById('mot_de_passe').value
    };

    const response = await fetch('/connexion', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    });

    const result = await response.json();

    if (response.ok) {
        alert('Connexion réussie ! Bienvenue ' + result.nom);
        window.location.href = '/accueil';
    } else {
        alert('Erreur : ' + result.erreur);
    }
});
</script>

</body>
</html>
