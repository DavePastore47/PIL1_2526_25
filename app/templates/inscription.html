<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription - IFRI MentorLink</title>
<!-- <link rel="stylesheet" href="/static/css/style.css"> -->
<link rel="stylesheet" href="/app/static/css/inscription_style.css">
</head>
<body>

<style>
</style>

<!-- NAVBAR -->
<nav class="navbar navbar-blue">
  <h1 class="titre-app">IFRI MentorLink</h1>
  <button class="burger-menu" id="burgerBtn">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <div class="nav-links" id="navLinks">
    <a href="/accueil">Accueil</a>
    <a href="#">À propos</a>
    <a href="/app/templates/connexion.html">Connexion</a>
    <a href="/app/templates/inscription.html" class="active">S'inscrire</a>
  </div>
</nav>

<main>
  <section class="auth-card">

    <!-- En-tête -->
    <h1>Créer un compte</h1>
    <p class="intro">Rejoignez la communauté MentorLink</p>

    <!-- Barre de progression -->
    <div class="progress-bar">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <form id="form-inscription">

      <!-- Section : Informations personnelles -->
      <p class="section-label">Informations personnelles</p>

      <div class="form-row">
        <div class="form-group">
          <label for="nom">Nom</label>
          <input type="text" id="nom" name="nom" placeholder="Votre nom" required>
        </div>
        <div class="form-group">
          <label for="prenom">Prénom</label>
          <input type="text" id="prenom" name="prenom" placeholder="Votre prénom" required>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="email@exemple.com" required>
      </div>

      <div class="form-group">
        <label for="telephone">Téléphone</label>
        <input type="text" id="telephone" name="telephone" placeholder="+229 0129000000" required>
        <small style="font-size:0.6875rem;color:#9ca3af">Format : +229 suivi de 10 chiffres</small>
      </div>

      <!-- Section : Parcours académique -->
      <div class="section-divider"></div>
      <p class="section-label">Parcours académique</p>

      <div class="form-row">
        <div class="form-group">
          <label for="filiere">Filière</label>
          <select id="filiere" name="filiere">
            <option value="">Choisir…</option>
            <option value="GL">Génie Logiciel (GL)</option>
            <option value="SI">Sécurité Informatique (SI)</option>
            <option value="IM">Internet et Multimédia (IM)</option>
            <option value="IA">Intelligence Artificielle (IA)</option>
            <option value="SE&IoT">Systèmes Embarqués & IoT</option>
          </select>
        </div>
        <div class="form-group">
          <label for="niveau">Niveau</label>
          <select id="niveau" name="niveau">
            <option value="">Choisir…</option>
            <option value="L1">Licence 1</option>
            <option value="L2">Licence 2</option>
            <option value="L3">Licence 3</option>
            <option value="M1">Master 1</option>
            <option value="M2">Master 2</option>
          </select>
        </div>
      </div>

      <!-- Section : Mot de passe -->
      <div class="section-divider"></div>
      <p class="section-label">Sécurité</p>

      <div class="form-group">
        <label for="mot_de_passe">Mot de passe</label>
        <input type="password" id="mot_de_passe" name="mot_de_passe" placeholder="Minimum 6 caractères" required>
      </div>

      <div class="form-group">
        <label for="confirm">Confirmer le mot de passe</label>
        <input type="password" id="confirm" name="confirm" placeholder="Répétez le mot de passe" required>
      </div>

      <button class="primary-button" type="submit">Créer mon compte</button>
    </form>

    <p class="auth-switch">
      Déjà un compte ? <a href="/app/templates/connexion.html">Connectez-vous</a>
    </p>
  </section>
</main>

<footer>
  <p>&copy;2026 IFRI_Mentor_link.</p>
</footer>

<script>

const burgerBtn = document.getElementById('burgerBtn');
const navLinks = document.getElementById('navLinks');
if (burgerBtn) {
    burgerBtn.addEventListener('click', function() {
        navLinks.classList.toggle('open');
    });
}


document.getElementById('form-inscription').addEventListener('submit', async function(e) {
    e.preventDefault();

    const mot_de_passe = document.getElementById('mot_de_passe').value;
    const confirm = document.getElementById('confirm').value;
    const telephone = document.getElementById('telephone').value;

    if (mot_de_passe !== confirm) {
        alert('Les mots de passe ne correspondent pas !');
        return;
    }

    if (mot_de_passe.length < 6) {
        alert('Le mot de passe doit contenir au moins 6 caractères !');
        return;
    }

    const formatTel = /^\+\d{3}\s\d{10}$/.test(telephone);
    if (!formatTel) {
        alert('Format du téléphone invalide.\nExemple : +229 0129000000');
        return;
    }

    const data = {
        nom: document.getElementById('nom').value,
        prenom: document.getElementById('prenom').value,
        email: document.getElementById('email').value,
        telephone: telephone,
        filiere: document.getElementById('filiere').value,
        niveau: document.getElementById('niveau').value,
        mot_de_passe: mot_de_passe
    };

    const response = await fetch('/inscription', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    });

    const result = await response.json();

    if (response.ok) {
        alert('Inscription réussie ! Vous pouvez vous connecter.');
        window.location.href = '/page-connexion';
    } else {
        alert('Erreur : ' + result.erreur);
    }
});
</script>

</body>
</html>
