<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - MentorLink</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: #1f2937;
            background:
                radial-gradient(circle at top right, rgba(20, 184, 166, 0.2), transparent 34%),
                linear-gradient(135deg, #f7f8fb 0%, #e9eef7 100%);
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 18px 8%;
            background-color: rgba(255, 255, 255, 0.82);
            border-bottom: 1px solid rgba(31, 41, 55, 0.08);
            backdrop-filter: blur(10px);
        }

        .logo {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 800;
            color: #12355b;
        }

        .nav-links {
            display: flex;
            gap: 14px;
        }

        .nav-links a {
            padding: 9px 12px;
            border-radius: 6px;
            color: #374151;
            font-weight: 700;
            text-decoration: none;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #ffffff;
            background-color: #2563eb;
        }

        main {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 73px);
            padding: 40px 20px;
        }

        .auth-card {
            width: min(100%, 460px);
            padding: 34px;
            background-color: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(31, 41, 55, 0.08);
            border-radius: 8px;
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
        }

        .auth-card h1 {
            margin: 0 0 8px;
            color: #111827;
            font-size: 2rem;
            text-align: center;
        }

        .intro {
            margin: 0 0 28px;
            color: #6b7280;
            line-height: 1.5;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #374151;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            color: #111827;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
        }

        .primary-button,
        .secondary-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 46px;
            padding: 13px 16px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        .primary-button {
            border: none;
            color: #ffffff;
            background-color: #2563eb;
        }

        .primary-button:hover {
            background-color: #1d4ed8;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.24);
            transform: translateY(-1px);
        }

        .secondary-link {
            margin-top: 12px;
            border: 1px solid #cbd5e1;
            color: #1f2937;
            background-color: #ffffff;
        }

        .secondary-link:hover {
            background-color: #f8fafc;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
            transform: translateY(-1px);
        }

        .auth-switch {
            margin: 22px 0 0;
            color: #6b7280;
            text-align: center;
        }

        .auth-switch a {
            color: #2563eb;
            font-weight: 800;
            text-decoration: none;
        }

        .auth-switch a:hover {
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            .navbar {
                align-items: flex-start;
                flex-direction: column;
                padding: 16px 20px;
            }

            .nav-links {
                width: 100%;
            }

            .nav-links a {
                flex: 1;
                text-align: center;
            }

            .auth-card {
                padding: 26px 20px;
            }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <p class="logo">MentorLink</p>
        <nav class="nav-links" aria-label="Navigation principale">
            <a href="/Accueil.html">Accueil</a>
            <a class="active" href="/inscription.html" aria-current="page">Inscription</a>
            <a href="/connexion.html">Connexion</a>
        </nav>
    </header>

    <main>
        <section class="auth-card" aria-labelledby="inscription-title">
            <h1 id="inscription-title">Inscription</h1>
            <p class="intro">Creez votre compte pour rejoindre MentorLink.</p>

            <form action="/register" method="post">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" name="username" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" required>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirmer le mot de passe</label>
                    <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required>
                </div>

                <button class="primary-button" type="submit">S'inscrire</button>
            </form>

            <a class="secondary-link" href="google">S'inscrire avec Google - bientot disponible</a>

            <p class="auth-switch">
                Deja un compte ?
                <a href="/connexion.html">Connectez-vous</a>
            </p>
        </section>
    </main>
</body>
</html>
