<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messagerie - IFRI MentorLink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/message.css">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <h1 class="titre-app">IFRI MentorLink</h1>
  <button class="burger-menu" id="burgerBtn">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <div class="nav-links" id="navLinks">
    <a href="/accueil">Accueil</a>
    <a href="/profil-page">Mon profil</a>
    <a href="/chat" class="active">Messages</a>
    <a href="/matching">Matching</a>
    <a href="#" onclick="deconnexion()">Déconnexion</a>
  </div>
</nav>

<div id="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Mes messages</div>
      <div class="sidebar-sub">IFRI · Messagerie</div>
    </div>

    <div class="search-bar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Rechercher...">
    </div>

    <div class="section-label">Conversations</div>

    <div class="contacts-list" id="convList">
      <p style="padding:16px;color:#94a3b8;font-size:13px">Chargement...</p>
    </div>

    <div class="sidebar-footer">
      <div class="my-avatar" id="myAvatar">?</div>
      <div class="my-info">
        <div class="my-name" id="myName">Mon Compte</div>
        <div class="my-role">Étudiant · IFRI</div>
      </div>
    </div>
  </aside>

  <main class="chat-area">
    <div class="chat-header">
      <div id="headerAvatar" class="header-avatar">?</div>
      <div class="chat-header-info">
        <div class="chat-header-name" id="headerName">Sélectionne une conversation</div>
        <div class="chat-header-status" id="headerStatus"></div>
      </div>
    </div>

    <div class="messages-zone" id="messagesZone">
      <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;font-size:14px">
        Sélectionne une conversation pour commencer
      </div>
    </div>

    <div class="typing-indicator" id="typingIndicator">
      <div class="dots"><i></i><i></i><i></i></div>
      <span id="typingName"></span><span> est en train d'écrire...</span>
    </div>

    <div class="emoji-picker" id="emojiPicker">
      <span>😊</span><span>👍</span><span>🎉</span><span>🔥</span>
      <span>💡</span><span>📚</span><span>✅</span><span>❓</span>
      <span>🙏</span><span>👏</span><span>💪</span><span>🚀</span>
      <span>😅</span><span>🤔</span><span>👀</span><span>💯</span>
    </div>

    <div class="input-zone">
      <div class="input-wrap">
        <input type="text" id="msgInput" placeholder="Écrire un message..." disabled>
        <button class="emoji-btn" id="emojiToggle">😊</button>
      </div>
      <button class="send-btn" id="sendBtn" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="m22 2-7 20-4-9-9-4 20-7z"/><path d="M22 2 11 13"/></svg>
      </button>
    </div>
  </main>
</div>

<script>
const burgerBtn = document.getElementById('burgerBtn');
const navLinks = document.getElementById('navLinks');
if (burgerBtn) {
    burgerBtn.addEventListener('click', function() {
        navLinks.classList.toggle('open');
    });
}

async function deconnexion() {
    await fetch('/deconnexion', { method: 'POST' });
    window.location.href = '/accueil';
}

const socket = io();
let convActive = null;
let monId = null;

const colors = [
    '#1a73e8', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4'
];

function getColor(id) {
    return colors[id % colors.length];
}

async function init() {
    const reponse = await fetch('/profil');
    const profil = await reponse.json();
    if (profil.erreur) { window.location.href = '/page-connexion'; return; }
    monId = profil.id;
    const initiales = (profil.prenom[0] + profil.nom[0]).toUpperCase();
    document.getElementById('myAvatar').textContent = initiales;
    document.getElementById('myName').textContent = profil.prenom + ' ' + profil.nom;
    
    await chargerConversations();

    const params = new URLSearchParams(window.location.search);
    const convId = params.get('conv');
    if (convId) {
        const items = document.querySelectorAll('.contact-item');
        items.forEach(function(item) {
            if (item.dataset.convId == convId) {
                item.click();
            }
        });
    }
}

async function chargerConversations() {
    const reponse = await fetch('/conversations');
    const data = await reponse.json();
    const container = document.getElementById('convList');
    container.innerHTML = '';

    if (!data.conversations || data.conversations.length === 0) {
        container.innerHTML = '<p style="padding:16px;color:#94a3b8;font-size:13px">Aucune conversation</p>';
        return;
    }

    data.conversations.forEach(function(conv) {
        const color = getColor(conv.id);
        const initiales = conv.interlocuteur ? conv.interlocuteur.substring(0, 2).toUpperCase() : '??';
        const el = document.createElement('div');
        el.className = 'contact-item' + (conv.id === convActive ? ' active' : '');
        el.innerHTML = `
            <div class="avatar" style="background:${color};color:white;">${initiales}
                ${conv.non_lus > 0 ? '<span class="badge"></span>' : ''}
            </div>
            <div class="contact-info">
                <div class="contact-name">${conv.interlocuteur || 'Inconnu'}</div>
                <div class="contact-preview">${conv.dernier_message || 'Aucun message'}</div>
            </div>
            <div class="contact-meta">
                ${conv.non_lus > 0 ? `<div class="unread-badge">${conv.non_lus}</div>` : ''}
            </div>
        `;
        el.onclick = function() {
            ouvrirConversation(conv.id, conv.interlocuteur, color);
        };
        el.dataset.convId = conv.id;
        container.appendChild(el);
    });
}

async function ouvrirConversation(convId, nom, color) {
    if (convActive) socket.emit('quitter_conversation', { conversation_id: convActive });
    convActive = convId;

    document.querySelectorAll('.contact-item').forEach(c => c.classList.remove('active'));
    event.currentTarget.classList.add('active');

    const initiales = nom ? nom.substring(0, 2).toUpperCase() : '??';
    document.getElementById('headerAvatar').textContent = initiales;
    document.getElementById('headerAvatar').style.background = color;
    document.getElementById('headerName').textContent = nom;
    document.getElementById('headerStatus').textContent = 'En ligne';
    document.getElementById('msgInput').disabled = false;
    document.getElementById('sendBtn').disabled = false;

    socket.emit('rejoindre_conversation', { conversation_id: convId });

    const reponse = await fetch('/conversations/' + convId + '/messages');
    const data = await reponse.json();
    afficherMessages(data.messages, color, initiales);
    chargerConversations();
}

function afficherMessages(messages, color, initiales) {
    const zone = document.getElementById('messagesZone');
    zone.innerHTML = '';
    if (!messages || messages.length === 0) {
        zone.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;font-size:14px">Aucun message. Commencez la conversation !</div>';
        return;
    }
    messages.forEach(function(msg) { ajouterBulle(msg, color, initiales); });
    zone.scrollTop = zone.scrollHeight;
}

function ajouterBulle(msg, color, initiales) {
    const zone = document.getElementById('messagesZone');
    const estMoi = msg.expediteur_id === monId;
    const row = document.createElement('div');
    row.className = 'msg-row ' + (estMoi ? 'sent' : 'recv');
    const heure = new Date(msg.envoye_a).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    const avatarHTML = !estMoi ? `<div class="msg-avatar" style="background:${color || '#1a73e8'};color:white;">${initiales || '?'}</div>` : '';
    row.innerHTML = `${avatarHTML}<div class="bubble">${msg.contenu}<span class="time">${heure}</span></div>`;
    zone.appendChild(row);
    zone.scrollTop = zone.scrollHeight;
}

function envoyerMessage() {
    const input = document.getElementById('msgInput');
    const contenu = input.value.trim();
    if (!contenu || !convActive) return;
    ajouterBulle({ expediteur_id: monId, contenu: contenu, envoye_a: new Date().toISOString() });
    socket.emit('envoyer_message', { conversation_id: convActive, contenu: contenu });
    input.value = '';
}

socket.on('nouveau_message', function(msg) {
    if (msg.conversation_id === convActive && msg.expediteur_id !== monId) {
        ajouterBulle(msg);
    }
    chargerConversations();
});

document.getElementById('searchInput').addEventListener('input', function() {
    const query = this.value.toLowerCase();
    document.querySelectorAll('.contact-item').forEach(function(el) {
        const nom = el.querySelector('.contact-name').textContent.toLowerCase();
        el.style.display = nom.includes(query) ? 'flex' : 'none';
    });
});

const emojiToggle = document.getElementById('emojiToggle');
const emojiPicker = document.getElementById('emojiPicker');
emojiToggle.addEventListener('click', e => { e.stopPropagation(); emojiPicker.classList.toggle('open'); });
emojiPicker.querySelectorAll('span').forEach(em => {
    em.addEventListener('click', () => {
        document.getElementById('msgInput').value += em.textContent;
        document.getElementById('msgInput').focus();
        emojiPicker.classList.remove('open');
    });
});
document.addEventListener('click', () => emojiPicker.classList.remove('open'));
document.getElementById('sendBtn').addEventListener('click', envoyerMessage);
document.getElementById('msgInput').addEventListener('keydown', e => { if (e.key === 'Enter') envoyerMessage(); });

init();
</script>
</body>
</html>
